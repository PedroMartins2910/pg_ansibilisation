---
all:
  vars:
    ansible_user: vagrant
    ansible_ssh_common_args: "-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null"
  children:
    pg_cluster:
      children:
        pg_data:
          hosts:
            lab-pg1:
              ansible_host: 192.168.56.11
              ansible_ssh_private_key_file: .vagrant/machines/lab-pg1/virtualbox/private_key
              repmgr_node_id: 1
              pg_initial_primary: true
            lab-pg2:
              ansible_host: 192.168.56.12
              ansible_ssh_private_key_file: .vagrant/machines/lab-pg2/virtualbox/private_key
              repmgr_node_id: 2
        pg_witness:
          hosts:
            lab-wit:
              ansible_host: 192.168.56.13
              ansible_ssh_private_key_file: .vagrant/machines/lab-wit/virtualbox/private_key
              repmgr_node_id: 99
              repmgr_priority: 0
