---
# 2 data nodes, no witness (automatic failover, split-brain risk accepted: see README).
# A repmgr witness in a third location can be added under pg_witness if one ever exists.
all:
  children:
    pg_cluster:
      children:
        pg_data:
          hosts:
            pgdb01:
              ansible_host: 10.10.0.11
              repmgr_node_id: 1
              repmgr_location: dc1
              pg_initial_primary: true      # only used for a brand-new cluster
            pgdb02:
              ansible_host: 10.10.0.12
              repmgr_node_id: 2
              repmgr_location: dc1
        pg_witness:
          hosts: {}
