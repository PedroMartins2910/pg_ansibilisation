---
# 2 data nodes + 1 repmgr witness (ideally in a third location).
all:
  children:
    pg_cluster:
      children:
        pg_data:
          hosts:
            pgdb01:
              ansible_host: 10.10.0.11
              repmgr_node_id: 1
              repmgr_location: dc1
              pg_initial_primary: true      # only used for a brand-new cluster
            pgdb02:
              ansible_host: 10.10.0.12
              repmgr_node_id: 2
              repmgr_location: dc1
        pg_witness:
          hosts:
            pgwit01:
              ansible_host: 10.10.0.13
              repmgr_node_id: 99
              repmgr_location: dc1
              repmgr_priority: 0
