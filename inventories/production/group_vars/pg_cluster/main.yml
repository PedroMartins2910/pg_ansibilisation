---
pg_cluster_name: billing
pg_version_full: "17.11"
# pg_repo_base_url: https://mirror.internal/pgdg   # only used for pgBadger now

# Filesystem: regular (FHS) or custom (everything under pkage)
pg_fs_layout: custom
pkage: /PKbilling01

# Build artifacts (tarballs) in S3; credentials in Vault <base>/artifacts_s3
pg_artifacts_s3_endpoint_url: https://s3.storage.internal
pg_artifacts_s3_bucket: pg-artifacts
pg_artifacts_s3_prefix: "postgres/"
pg_artifacts_s3_ca_bundle: "{{ inventory_dir }}/files/s3-ca.pem"
pgaudit_version: "17.1"
pgauditlogtofile_version: "1.6.4"
repmgr_version: "5.5.0"
pgbackrest_version: "2.54.2"

# Application database: schema has the same name
pg_db_name: billing
pg_role_ro_name: billing_read
pg_role_dml_name: billing_write
pg_role_ddl_name: billing_owner

# Login users; passwords: Vault <hashi_vault_users_path>/<name>, key "password"
pg_login_users:
  - {name: billing_app, group: dml}
  - {name: billing_report, group: ro}
  - {name: billing_migrate, group: ddl}

pg_hba_app_cidrs:
  - 10.20.0.0/16

# PostgreSQL tuning
pg_settings_extra:
  shared_buffers: 8GB
  effective_cache_size: 24GB
  work_mem: 32MB
  maintenance_work_mem: 1GB
  max_connections: 300

# Backups: pgBackRest -> on-prem S3 (credentials from Vault, see hashi_vault.yml)
pgbackrest_s3_endpoint: s3.storage.internal
pgbackrest_s3_port: 443
pgbackrest_s3_bucket: pg-backups
pgbackrest_s3_region: us-east-1
pgbackrest_s3_uri_style: path
pgbackrest_s3_ca_cert_src: "{{ inventory_dir }}/files/s3-ca.pem"   # your private CA ("" if publicly trusted)
pgbackrest_retention_full: 14       # daily full backups -> 14 days of PITR
backup_cron_hour: "1"
pgbackrest_encrypt: false           # true -> cipher pass from Vault <base>/pgbackrest_cipher

# pgBadger: placeholder report script until the in-house one is provided
# pgbadger_script_src: "{{ inventory_dir }}/files/pgbadger_report.sh.j2"
