---
- name: Create data directory
  ansible.builtin.file:
    path: "{{ pg_data_dir }}"
    state: directory
    owner: postgres
    group: postgres
    mode: "0700"

- name: initdb
  ansible.builtin.command:
    cmd: "{{ pg_bin_dir }}/initdb -D {{ pg_data_dir }} {{ pg_initdb_options }}"
    creates: "{{ pg_data_dir }}/PG_VERSION"
  become: true
  become_user: postgres

- name: Mark node as freshly initialised
  ansible.builtin.set_fact:
    _pg_fresh_init: true
