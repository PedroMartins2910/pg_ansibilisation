---
# hashi_vault : passwords read from HashiCorp Vault KV v2 (production)
# vars        : passwords read from pg_secrets_static (lab / CI ONLY)
secrets_backend: hashi_vault

# HashiCorp Vault connection. Authentication is taken from the environment:
#   token   : VAULT_TOKEN (or ~/.vault-token)
#   approle : ANSIBLE_HASHI_VAULT_ROLE_ID / ANSIBLE_HASHI_VAULT_SECRET_ID
hashi_vault_url: "https://vault.example.com:8200"
hashi_vault_auth_method: token
hashi_vault_mount: secret
hashi_vault_validate_certs: true
hashi_vault_password_key: password

# KV layout (each secret holds a key named {{ hashi_vault_password_key }})
hashi_vault_base_path: "postgres/{{ pg_cluster_name }}"
hashi_vault_repmgr_path: "{{ hashi_vault_base_path }}/repmgr"
hashi_vault_postgres_path: "{{ hashi_vault_base_path }}/postgres"
hashi_vault_users_path: "{{ hashi_vault_base_path }}/users"   # + /<username>, or per-user vault_path
# pgBackRest S3 credentials (keys below) and optional repo cipher passphrase (key {{ hashi_vault_password_key }})
hashi_vault_pgbackrest_s3_path: "{{ hashi_vault_base_path }}/pgbackrest_s3"
hashi_vault_s3_access_key_field: access_key
hashi_vault_s3_secret_key_field: secret_key
# Build tarballs bucket (only read when pg_artifacts_source == 's3'), same key fields as above
hashi_vault_artifacts_s3_path: "{{ hashi_vault_base_path }}/artifacts_s3"
hashi_vault_pgbackrest_cipher_path: "{{ hashi_vault_base_path }}/pgbackrest_cipher"

# Also set a password on the postgres superuser role (peer auth is used locally anyway)
pg_manage_postgres_password: false

# Only for secrets_backend=vars:
# pg_secrets_static:
#   repmgr_password: ...
#   postgres_password: ...
#   users: {app_user: ..., report_user: ...}
#   pgbackrest_s3_access_key: ...
#   pgbackrest_s3_secret_key: ...
#   pgbackrest_cipher_pass: ...      # only if pgbackrest_encrypt
#   artifacts_s3_access_key: ...     # only if pg_artifacts_source == 's3'
#   artifacts_s3_secret_key: ...
pg_secrets_static: {}
