---
# Resolves every secret ONCE on the controller, then copies it to all hosts as facts:
#   repmgr_password, pg_postgres_password, pg_login_passwords (dict user -> password)

- name: Resolve secrets from HashiCorp Vault
  when: secrets_backend == 'hashi_vault'
  run_once: true
  no_log: true
  block:
    - name: Read repmgr / postgres passwords from Vault
      ansible.builtin.set_fact:
        _sec_repmgr: >-
          {{ lookup('community.hashi_vault.vault_kv2_get', hashi_vault_repmgr_path,
                    url=hashi_vault_url, auth_method=hashi_vault_auth_method,
                    engine_mount_point=hashi_vault_mount,
                    validate_certs=hashi_vault_validate_certs).secret[hashi_vault_password_key]
             if repmgr_enabled | bool else '' }}
        _sec_postgres: >-
          {{ lookup('community.hashi_vault.vault_kv2_get', hashi_vault_postgres_path,
                    url=hashi_vault_url, auth_method=hashi_vault_auth_method,
                    engine_mount_point=hashi_vault_mount,
                    validate_certs=hashi_vault_validate_certs).secret[hashi_vault_password_key]
             if pg_manage_postgres_password else '' }}

    - name: Read pgBackRest S3 credentials from Vault
      ansible.builtin.set_fact:
        _sec_s3: >-
          {{ lookup('community.hashi_vault.vault_kv2_get', hashi_vault_pgbackrest_s3_path,
                    url=hashi_vault_url, auth_method=hashi_vault_auth_method,
                    engine_mount_point=hashi_vault_mount,
                    validate_certs=hashi_vault_validate_certs).secret }}
        _sec_cipher: >-
          {{ lookup('community.hashi_vault.vault_kv2_get', hashi_vault_pgbackrest_cipher_path,
                    url=hashi_vault_url, auth_method=hashi_vault_auth_method,
                    engine_mount_point=hashi_vault_mount,
                    validate_certs=hashi_vault_validate_certs).secret[hashi_vault_password_key]
             if pgbackrest_encrypt | bool else '' }}

    - name: Read build artifacts S3 credentials from Vault
      ansible.builtin.set_fact:
        _sec_art_s3: >-
          {{ lookup('community.hashi_vault.vault_kv2_get', hashi_vault_artifacts_s3_path,
                    url=hashi_vault_url, auth_method=hashi_vault_auth_method,
                    engine_mount_point=hashi_vault_mount,
                    validate_certs=hashi_vault_validate_certs).secret }}
      when: pg_artifacts_source == 's3'

    - name: Read login user passwords from Vault
      ansible.builtin.set_fact:
        _sec_users: >-
          {{ _sec_users | default({}) | combine({item.name:
               lookup('community.hashi_vault.vault_kv2_get',
                      item.vault_path | default(hashi_vault_users_path ~ '/' ~ item.name),
                      url=hashi_vault_url, auth_method=hashi_vault_auth_method,
                      engine_mount_point=hashi_vault_mount,
                      validate_certs=hashi_vault_validate_certs).secret[hashi_vault_password_key]}) }}
      loop: "{{ pg_login_users }}"

- name: Resolve secrets from static vars (lab/CI only)
  when: secrets_backend == 'vars'
  run_once: true
  no_log: true
  ansible.builtin.set_fact:
    _sec_repmgr: "{{ pg_secrets_static.repmgr_password | default('') }}"
    _sec_postgres: "{{ pg_secrets_static.postgres_password | default('') }}"
    _sec_users: "{{ pg_secrets_static.users | default({}) }}"
    _sec_s3:
      access_key: "{{ pg_secrets_static.pgbackrest_s3_access_key | default('') }}"
      secret_key: "{{ pg_secrets_static.pgbackrest_s3_secret_key | default('') }}"
    _sec_cipher: "{{ pg_secrets_static.pgbackrest_cipher_pass | default('') }}"
    _sec_art_s3:
      access_key: "{{ pg_secrets_static.artifacts_s3_access_key | default('') }}"
      secret_key: "{{ pg_secrets_static.artifacts_s3_secret_key | default('') }}"

- name: Distribute secrets to every host
  no_log: true
  ansible.builtin.set_fact:
    repmgr_password: "{{ hostvars[ansible_play_batch | first]._sec_repmgr }}"
    pg_postgres_password: "{{ hostvars[ansible_play_batch | first]._sec_postgres }}"
    pg_login_passwords: "{{ hostvars[ansible_play_batch | first]._sec_users | default({}) }}"
    pgbackrest_s3_key: "{{ hostvars[ansible_play_batch | first]._sec_s3[hashi_vault_s3_access_key_field if secrets_backend == 'hashi_vault' else 'access_key'] }}"
    pgbackrest_s3_key_secret: "{{ hostvars[ansible_play_batch | first]._sec_s3[hashi_vault_s3_secret_key_field if secrets_backend == 'hashi_vault' else 'secret_key'] }}"
    pgbackrest_cipher_pass: "{{ hostvars[ansible_play_batch | first]._sec_cipher }}"
    pg_artifacts_s3_access_key: "{{ (hostvars[ansible_play_batch | first]._sec_art_s3 | default({}))[hashi_vault_s3_access_key_field if secrets_backend == 'hashi_vault' else 'access_key'] | default('') }}"
    pg_artifacts_s3_secret_key: "{{ (hostvars[ansible_play_batch | first]._sec_art_s3 | default({}))[hashi_vault_s3_secret_key_field if secrets_backend == 'hashi_vault' else 'secret_key'] | default('') }}"

- name: Validate secrets
  ansible.builtin.assert:
    that:
      - not (repmgr_enabled | bool) or repmgr_password | length > 0
      - pgbackrest_s3_key | length > 0 and pgbackrest_s3_key_secret | length > 0
      - not (pgbackrest_encrypt | bool) or pgbackrest_cipher_pass | length > 0
      - pg_artifacts_source != 's3' or (pg_artifacts_s3_access_key | length > 0 and pg_artifacts_s3_secret_key | length > 0)
      - pg_login_users | map(attribute='name') | difference(pg_login_passwords.keys() | list) | length == 0
    fail_msg: "Missing secrets: repmgr password, pgBackRest S3 keys / cipher pass, artifacts S3 keys, or a password for one of pg_login_users"
    quiet: true
  no_log: true
