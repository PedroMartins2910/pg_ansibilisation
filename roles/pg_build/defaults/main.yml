---
# Compiles PostgreSQL, its extensions and pgBackRest from the tarballs listed in
# pg_artifacts (playbooks/group_vars/all.yml). Versions, paths and the bucket are vars there.

pg_build_src_root: /usr/local/src/pg-ops
pg_build_jobs: "{{ ansible_processor_vcpus | default(2) }}"
pg_build_keep_sources: false           # true = keep the unpacked/compiled trees for debugging

# Compilation prerequisites (RHEL family). readline/lz4 runtime libs are pulled in too.
pg_build_packages:
  - gcc
  - make
  - openssl-devel
  - lz4
  - lz4-devel
  - perl
  - perl-devel
  - readline
  - readline-devel
  - flex
  - bison
  - libcurl-devel
  - json-c-devel
  - zlib-devel
  - libicu-devel
  - systemd-devel
  - pkgconf-pkg-config
  - tar
  - gzip

pg_configure_options:
  - --with-openssl
  - --with-lz4
  - --with-readline
  - --with-icu
  - --with-systemd                     # the unit uses Type=notify
pg_configure_extra_options: []

# How each extension is built (pgxs = make USE_PGXS=1, configure = ./configure first)
pg_build_extension_types:
  pgaudit: pgxs
  pgauditlogtofile: pgxs
  pgvector: pgxs
  repmgr: configure

# Extensions compiled into the PostgreSQL prefix. pgcrypto is part of contrib (always built).
pg_build_extensions: >-
  {{ ['pgaudit', 'pgauditlogtofile']
     + (['repmgr'] if repmgr_enabled | bool else [])
     + (['pgvector'] if 'pgvector' in (pg_extensions_optional | map(attribute='name') | list) else []) }}

# The per-major symlink (pg_install_link) is only switched to a new full version when
# nothing runs on it yet, or when this is true (set by minor_upgrade.yml).
pg_build_allow_switch: false

# pgBackRest (>= 2.51 builds with meson)
pgbackrest_build_packages:
  - meson
  - ninja-build
  - libyaml-devel                      # RHEL: CRB / PowerTools repository
  - libxml2-devel
  - bzip2-devel
  - libzstd-devel
  - libssh2-devel
  - pkgconf-pkg-config
pgbackrest_ldconfig_file: /etc/ld.so.conf.d/pg-ops-libpq.conf

# amazon.aws.s3_object: true = path-style addressing / no AWS-only calls (MinIO, Ceph, ...)
pg_artifacts_s3_path_style: true
