---
# pgBackRest {{ pgbackrest_version }} compiled into pgbackrest_install_dir and linked
# as {{ pgbackrest_bin }}. Links against the libpq of the active PostgreSQL major.
- name: pgBackRest build prerequisites
  ansible.builtin.dnf:
    name: "{{ pg_build_packages + pgbackrest_build_packages }}"
    state: present

- name: Source directory
  ansible.builtin.file:
    path: "{{ pg_build_src_root }}"
    state: directory
    mode: "0755"

- name: Read pgBackRest build marker
  ansible.builtin.command: cat {{ pgbackrest_install_dir }}/.pgops_build
  register: _pgb_pbr_marker
  changed_when: false
  failed_when: false

- name: Compile pgBackRest {{ pgbackrest_version }}
  when: (_pgb_pbr_marker.stdout | default('') | trim) != pg_artifacts.pgbackrest.file
  environment:
    PKG_CONFIG_PATH: "{{ pg_install_link }}/lib/pkgconfig"
  block:
    - name: Fetch sources
      ansible.builtin.include_tasks: fetch.yml
      vars:
        _art: pgbackrest

    - name: meson setup
      ansible.builtin.command:
        cmd: "meson setup build --prefix={{ pgbackrest_install_dir }} --buildtype=release"
        chdir: "{{ _art_src }}"
      changed_when: true

    - name: ninja
      ansible.builtin.command:
        cmd: "ninja -C build -j {{ pg_build_jobs }}"
        chdir: "{{ _art_src }}"
      changed_when: true

    - name: meson install
      ansible.builtin.command:
        cmd: meson install -C build
        chdir: "{{ _art_src }}"
      changed_when: true

    - name: Write build marker
      ansible.builtin.copy:
        dest: "{{ pgbackrest_install_dir }}/.pgops_build"
        content: "{{ pg_artifacts.pgbackrest.file }}\n"
        mode: "0644"

    - name: Remove sources
      ansible.builtin.file:
        path: "{{ _art_src }}"
        state: absent
      when: not (pg_build_keep_sources | bool)

- name: Runtime linker path for libpq
  ansible.builtin.copy:
    dest: "{{ pgbackrest_ldconfig_file }}"
    content: "{{ pg_install_link }}/lib\n"
    mode: "0644"
  register: _pgb_ld

- name: ldconfig
  ansible.builtin.command: ldconfig
  changed_when: true
  when: _pgb_ld is changed

- name: "{{ pgbackrest_bin }} -> active build"
  ansible.builtin.file:
    src: "{{ pgbackrest_install_dir }}/bin/pgbackrest"
    dest: "{{ pgbackrest_bin }}"
    state: link
    force: true

- name: pgBackRest runs
  ansible.builtin.command: "{{ pgbackrest_bin }} version"
  changed_when: false
