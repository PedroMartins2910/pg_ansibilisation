---
# PostgreSQL {{ pg_version_full }} + extensions compiled into pg_install_dir.
# Idempotent: a marker file in the prefix records what was built; nothing is rebuilt
# unless the version or the configure options change.

- name: Look for the postgres OS user
  ansible.builtin.command: id -u postgres
  register: _pgb_user
  changed_when: false
  failed_when: false

- name: postgres OS group and user (only created if missing; an existing account is left as is)
  when: _pgb_user.rc != 0
  block:
    - name: postgres group
      ansible.builtin.group:
        name: postgres
        system: true
    - name: postgres user
      ansible.builtin.user:
        name: postgres
        group: postgres
        system: true
        home: "{{ pg_home_dir }}"
        create_home: true
        shell: /bin/bash
        comment: PostgreSQL

- name: Home directory of postgres
  ansible.builtin.file:
    path: "{{ pg_home_dir }}"
    state: directory
    owner: postgres
    group: postgres
    mode: "0700"

- name: Build prerequisites
  ansible.builtin.dnf:
    name: "{{ pg_build_packages }}"
    state: present

- name: Source directory
  ansible.builtin.file:
    path: "{{ pg_build_src_root }}"
    state: directory
    mode: "0755"

- name: Build fingerprint
  ansible.builtin.set_fact:
    _pgb_fingerprint: >-
      {{ pg_version_full }}|{{ (pg_configure_options + pg_configure_extra_options) | join(' ') }}|{{ pg_socket_dir }}|{{ pg_artifacts.postgresql.sha256 | default('') }}

- name: Read build marker of {{ pg_install_dir }}
  ansible.builtin.command: cat {{ pg_install_dir }}/.pgops_build
  register: _pgb_marker
  changed_when: false
  failed_when: false

- name: Compile PostgreSQL {{ pg_version_full }}
  when: (_pgb_marker.stdout | default('') | trim) != (_pgb_fingerprint | trim)
  block:
    - name: Fetch sources
      ansible.builtin.include_tasks: fetch.yml
      vars:
        _art: postgresql

    - name: Default socket directory {{ pg_socket_dir }} (instead of /tmp)
      ansible.builtin.replace:
        path: "{{ _art_src }}/src/include/pg_config_manual.h"
        regexp: '^#define DEFAULT_PGSOCKET_DIR\s+.*$'
        replace: '#define DEFAULT_PGSOCKET_DIR  "{{ pg_socket_dir }}"'

    - name: configure
      ansible.builtin.command:
        cmd: "./configure --prefix={{ pg_install_dir }} {{ (pg_configure_options + pg_configure_extra_options) | join(' ') }}"
        chdir: "{{ _art_src }}"
      changed_when: true

    - name: make world-bin (server, client tools, contrib incl. pgcrypto and pg_stat_statements)
      ansible.builtin.command:
        cmd: "make -j{{ pg_build_jobs }} world-bin"
        chdir: "{{ _art_src }}"
      async: 7200
      poll: 15
      changed_when: true

    - name: make install-world-bin
      ansible.builtin.command:
        cmd: make install-world-bin
        chdir: "{{ _art_src }}"
      changed_when: true

    - name: Write build marker
      ansible.builtin.copy:
        dest: "{{ pg_install_dir }}/.pgops_build"
        content: "{{ _pgb_fingerprint | trim }}\n"
        mode: "0644"

    - name: Remove sources
      ansible.builtin.file:
        path: "{{ _art_src }}"
        state: absent
      when: not (pg_build_keep_sources | bool)

- name: Extensions
  ansible.builtin.include_tasks: extension.yml
  loop: "{{ pg_build_extensions }}"
  loop_control:
    loop_var: _ext

- name: Current target of {{ pg_install_link }}
  ansible.builtin.stat:
    path: "{{ pg_install_link }}"
  register: _pgb_link

- name: Point {{ pg_install_link }} to {{ pg_install_dir }}
  ansible.builtin.file:
    src: "{{ pg_install_dir }}"
    dest: "{{ pg_install_link }}"
    state: link
    force: true
  register: _pgb_link_set
  when: >-
    not _pgb_link.stat.exists
    or _pgb_link.stat.lnk_source | default('') == pg_install_dir
    or pg_build_allow_switch | bool
    or pg_node_role | default('') == 'uninitialized'

- name: Version switch postponed
  ansible.builtin.debug:
    msg: >-
      {{ inventory_hostname }}: PostgreSQL {{ pg_version_full }} is built in {{ pg_install_dir }} but
      {{ pg_install_link }} still points to {{ _pgb_link.stat.lnk_source | default('?') }} because the
      instance is in use. Run playbooks/minor_upgrade.yml to switch with one switchover.
  when: _pgb_link_set is skipped
