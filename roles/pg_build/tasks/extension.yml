---
# Build ONE extension (_ext) against the PostgreSQL in pg_install_dir.
- name: "{{ _ext }}: read build marker"
  ansible.builtin.command: cat {{ pg_install_dir }}/.pgops_ext_{{ _ext }}
  register: _pgb_ext_marker
  changed_when: false
  failed_when: false

- name: "{{ _ext }}: compile and install"
  when: (_pgb_ext_marker.stdout | default('') | trim) != pg_artifacts[_ext].file
  environment:
    PATH: "{{ pg_install_dir }}/bin:{{ ansible_env.PATH | default('/usr/sbin:/usr/bin:/sbin:/bin') }}"
    PG_CONFIG: "{{ pg_install_dir }}/bin/pg_config"
  block:
    - name: "{{ _ext }}: fetch sources"
      ansible.builtin.include_tasks: fetch.yml
      vars:
        _art: "{{ _ext }}"

    - name: "{{ _ext }}: configure"
      ansible.builtin.command:
        cmd: ./configure
        chdir: "{{ _art_src }}"
      changed_when: true
      when: pg_build_extension_types[_ext] == 'configure'

    - name: "{{ _ext }}: make"
      ansible.builtin.command:
        cmd: "make -j{{ pg_build_jobs }} USE_PGXS=1 PG_CONFIG={{ pg_install_dir }}/bin/pg_config"
        chdir: "{{ _art_src }}"
      changed_when: true

    - name: "{{ _ext }}: make install"
      ansible.builtin.command:
        cmd: "make USE_PGXS=1 PG_CONFIG={{ pg_install_dir }}/bin/pg_config install"
        chdir: "{{ _art_src }}"
      changed_when: true

    - name: "{{ _ext }}: write build marker"
      ansible.builtin.copy:
        dest: "{{ pg_install_dir }}/.pgops_ext_{{ _ext }}"
        content: "{{ pg_artifacts[_ext].file }}\n"
        mode: "0644"

    - name: "{{ _ext }}: remove sources"
      ansible.builtin.file:
        path: "{{ _art_src }}"
        state: absent
      when: not (pg_build_keep_sources | bool)
