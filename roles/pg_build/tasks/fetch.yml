---
# Fetch ONE artifact (key of pg_artifacts, in _art) and unpack it on the host.
# Output fact: _art_src = directory holding the unpacked sources (top-level dir stripped).
- name: "{{ _art }}: artifact facts"
  ansible.builtin.set_fact:
    _art_file: "{{ pg_artifacts[_art].file }}"
    _art_ctrl_path: >-
      {{ (pg_artifacts_cache_dir if pg_artifacts_source == 's3' else pg_artifacts_local_dir)
         ~ '/' ~ pg_artifacts[_art].file }}
    _art_src: "{{ pg_build_src_root }}/{{ pg_artifacts[_art].file | regex_replace('\\.(tar\\.gz|tgz|tar\\.bz2|tar\\.xz)$', '') }}"

- name: "{{ _art }}: get {{ _art_file }} on the controller"
  run_once: true
  delegate_to: localhost
  become: false
  block:
    - name: "{{ _art }}: cache directory"
      ansible.builtin.file:
        path: "{{ pg_artifacts_cache_dir }}"
        state: directory
        mode: "0750"
      when: pg_artifacts_source == 's3'

    - name: "{{ _art }}: download from s3://{{ pg_artifacts_s3_bucket }}/{{ pg_artifacts_s3_prefix }}{{ _art_file }}"
      amazon.aws.s3_object:
        mode: get
        endpoint_url: "{{ pg_artifacts_s3_endpoint_url }}"
        region: "{{ pg_artifacts_s3_region }}"
        bucket: "{{ pg_artifacts_s3_bucket }}"
        object: "{{ pg_artifacts_s3_prefix }}{{ _art_file }}"
        dest: "{{ _art_ctrl_path }}"
        overwrite: never                # file names carry the version
        access_key: "{{ pg_artifacts_s3_access_key }}"
        secret_key: "{{ pg_artifacts_s3_secret_key }}"
        validate_certs: "{{ pg_artifacts_s3_validate_certs }}"
        aws_ca_bundle: "{{ pg_artifacts_s3_ca_bundle if pg_artifacts_s3_ca_bundle | length > 0 else omit }}"
        ceph: "{{ pg_artifacts_s3_path_style }}"
      no_log: true
      when: pg_artifacts_source == 's3'

    - name: "{{ _art }}: check the tarball"
      ansible.builtin.stat:
        path: "{{ _art_ctrl_path }}"
        checksum_algorithm: sha256
      register: _art_stat

    - name: "{{ _art }}: tarball present and checksum OK"
      ansible.builtin.assert:
        that:
          - _art_stat.stat.exists
          - pg_artifacts[_art].sha256 | default('') | length == 0 or _art_stat.stat.checksum == pg_artifacts[_art].sha256
        fail_msg: "{{ _art_ctrl_path }} is missing or its sha256 differs from pg_artifacts.{{ _art }}.sha256"
        quiet: true

- name: "{{ _art }}: clean source directory"
  ansible.builtin.file:
    path: "{{ _art_src }}"
    state: "{{ item }}"
    mode: "0755"
  loop: [absent, directory]

- name: "{{ _art }}: unpack"
  ansible.builtin.unarchive:
    src: "{{ _art_ctrl_path }}"
    dest: "{{ _art_src }}"
    extra_opts: [--strip-components=1]
