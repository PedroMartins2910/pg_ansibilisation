---
# Single-node scenario: repmgr disabled, regular filesystem layout.
all:
  vars:
    ansible_connection: community.docker.docker
    ansible_python_interpreter: /usr/bin/python3
  children:
    pg_cluster:
      children:
        pg_data:
          hosts:
            solo:
              ansible_host: pgops-e2e-solo
              pg_node_ip: 172.30.0.14
              pg_initial_primary: true
        pg_witness:
          hosts: {}
