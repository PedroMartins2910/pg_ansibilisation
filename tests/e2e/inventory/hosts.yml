---
# HA scenario: 2 data nodes + repmgr witness, custom filesystem layout.
all:
  vars:
    ansible_connection: community.docker.docker
    ansible_python_interpreter: /usr/bin/python3
  children:
    pg_cluster:
      children:
        pg_data:
          hosts:
            pg1:
              ansible_host: pgops-e2e-pg1
              pg_node_ip: 172.30.0.11
              repmgr_node_id: 1
              pg_initial_primary: true
            pg2:
              ansible_host: pgops-e2e-pg2
              pg_node_ip: 172.30.0.12
              repmgr_node_id: 2
        pg_witness:
          hosts:
            wit:
              ansible_host: pgops-e2e-wit
              pg_node_ip: 172.30.0.13
              repmgr_node_id: 99
              repmgr_priority: 0
