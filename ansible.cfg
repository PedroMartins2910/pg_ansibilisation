[defaults]
roles_path = ./roles
forks = 10
gathering = smart
interpreter_python = auto_silent
retry_files_enabled = False
callback_result_format = yaml
timeout = 30
# No default inventory on purpose: always pass -i inventories/<env>/hosts.yml

[ssh_connection]
# pipelining avoids the world-readable temp-file problem when becoming 'postgres'
pipelining = True
ssh_args = -o ControlMaster=auto -o ControlPersist=60s
