---
# Project-wide defaults.
# Override them per environment in inventories/<env>/group_vars/pg_cluster/*.yml
# (NOT in inventory group_vars/all: that has LOWER precedence than this file).

pg_cluster_name: pgcluster
# Exact PostgreSQL version installed from the PGDG repository (Nexus mirror, see
# roles/pg_repo). pg_version (the major) is derived from it: package, path, service and
# repmgr names use the major. Changing pg_version_full on a running cluster does nothing
# until playbooks/minor_upgrade.yml runs (packages are version-locked).
pg_version_full: "17.11"
pg_version: "{{ (pg_version_full | string).split('.')[0] }}"
pg_port: 5432

# ---------------------------------------------------------------- filesystem layout
# Binaries always come from the PGDG RPMs (/usr/pgsql-<major>). Data, logs and certificates:
#   regular : standard paths (/var/lib/pgsql, /var/log/<component>, /etc/pki/pgsql)
#   custom  : under the pkage prefix (e.g. /PKfbgad1):
#             <pkage>/data/pgs, <pkage>/log/<component>, <pkage>/soft/<host>.jks
# Every path below can still be overridden per host.
pg_fs_layout: regular
pkage: ""
pg_fs_layouts:
  regular:
    data: /var/lib/pgsql
    log: /var/log
    pg_log: /var/log/postgresql
    certs: /etc/pki/pgsql
  custom:
    data: "{{ pkage }}/data/pgs"
    log: "{{ pkage }}/log"
    pg_log: "{{ pkage }}/log/pgs"
    certs: "{{ pkage }}/soft/{{ ansible_hostname | default(inventory_hostname_short) }}.jks"
pg_log_root: "{{ pg_fs_layouts[pg_fs_layout].log }}"
pg_log_dir: "{{ pg_fs_layouts[pg_fs_layout].pg_log }}"
pg_cert_dir: "{{ pg_fs_layouts[pg_fs_layout].certs }}"

# "{version}" (major) is substituted so that the major upgrade can compute old and new locations.
pg_data_dir_template: "{{ pg_fs_layouts[pg_fs_layout].data }}/{version}/data"
pg_data_dir: "{{ pg_data_dir_template | replace('{version}', pg_version | string) }}"
pg_bin_dir: "/usr/pgsql-{{ pg_version }}/bin"
pg_service: "postgresql-{{ pg_version }}"
pg_home_dir: /var/lib/pgsql          # home of the postgres OS user (created by the RPM)
pg_socket_dir: /run/postgresql
pgbackrest_bin: /usr/bin/pgbackrest

# Extensions (PGDG packages <name>_<major>). pgaudit + pgauditlogtofile are always
# installed and preloaded; pgcrypto ships with -contrib.
# Optional, created only on request:  [{name: vector, db: appdb}, {name: pgcrypto, db: appdb}]
# (vector = pgvector; its package is installed automatically, see pg_extension_package_map)
pg_extensions_optional: []
# Created in the application database and template1 (new databases inherit them)
pg_extensions_default: [pgaudit, pgauditlogtofile, pg_stat_statements]

# IP that the other nodes use to reach this node (pg_hba, repmgr conninfo, pgBackRest).
pg_node_ip: "{{ ansible_default_ipv4.address }}"

# repmgr. false = single data node, no replication, no witness (some apps do not
# need HA). The HA playbooks (switchover, promote, rejoin, rebuild_replica,
# minor/major upgrade, restore_pitr) refuse to run when it is false.
repmgr_enabled: true
repmgr_user: repmgr
repmgr_db: repmgr
repmgr_node_name: "{{ inventory_hostname_short }}"
repmgr_conf_path: "/etc/repmgr/{{ pg_version }}/repmgr.conf"
repmgr_service: "repmgr-{{ pg_version }}"
repmgr_bin: "{{ pg_bin_dir }}/repmgr"
repmgr_cmd: "{{ repmgr_bin }} -f {{ repmgr_conf_path }}"
repmgr_force_register: false

# psql shortcut (always run with become_user: postgres)
psql_cmd: "{{ pg_bin_dir }}/psql -X -A -t -q -p {{ pg_port }}"

# pg-ops shared paths
pgops_conf_dir: /etc/pg-ops
pgops_log_dir: "{{ pg_log_root }}/pg-ops"
pgops_maintenance_flag: /etc/pg-ops/maintenance

# Application database / roles (see roles/db_bootstrap)
pg_login_users: []

# pgBackRest (see roles/pgbackrest). Shared here because postgresql (archive/restore
# command) and secrets (optional cipher pass) need them too.
pgbackrest_stanza: "{{ pg_cluster_name }}"
pgbackrest_encrypt: false            # true = aes-256-cbc repo encryption, passphrase from Vault

# Log line prefix shared by PostgreSQL and pgBadger (Dynatrace parses it too)
pg_log_line_prefix: "%m [%p]: user=%u,db=%d,app=%a,client=%h "

# Safety switches
pg_allow_restart: false
