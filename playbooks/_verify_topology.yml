---
# Shared post-change verification: facts, standbys streaming.
- name: Verify topology
  hosts: pg_cluster
  become: true
  gather_facts: false
  roles:
    - pg_facts
  tasks:
    - name: Standbys must be streaming
      ansible.builtin.include_role:
        name: repmgr
        tasks_from: wait_streaming.yml
      when: pg_node_role == 'standby'

    - name: Cluster
      ansible.builtin.include_role:
        name: repmgr
        tasks_from: cluster_show.yml
      when:
        - repmgr_enabled | bool
        - inventory_hostname == pg_current_primary
